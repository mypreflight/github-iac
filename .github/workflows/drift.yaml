name: drift

# Every night: fails if someone changed the org by hand (plan not empty) or
# created something that is not described in config/*.yaml.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    permissions:
      contents: read
    env:
      TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: write
          permission-members: read
          permission-organization-administration: read

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: infra/.opentofu-version
          tofu_wrapper: false

      - name: Initialize OpenTofu
        run: tofu init -input=false -backend-config=backend.hcl

      - name: Plan (fails on drift)
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: tofu plan -input=false -lock-timeout=10m -detailed-exitcode -out=tfplan

      - name: Report the plan
        if: always()
        uses: gi-org-pl/report-tofu-plan-action@3e9723344bbd1c09659e14bf34be192d8db84213 # v1.0.1
        with:
          working-directory: infra

      - name: Look for unmanaged repositories, teams and members
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        working-directory: .
        run: node scripts/bootstrap.js --check
